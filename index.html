<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Legal Lab</title>
<meta name="theme-color" content="#1d3557">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --ink:#1b2430; --muted:#5b6675; --bg:#f5f6f8; --card:#fff; --line:#dde2e8;
  --navy:#1d3557; --teal:#1f7a8c; --good:#2e7d32; --goodbg:#e8f5e9;
  --bad:#c62828; --badbg:#fdecea; --hi:#fff4c2; --chip:#e8eef6;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:17px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{background:var(--navy);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:5}
header .row{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1;cursor:pointer}
header small{opacity:.75;font-size:12px}
main{max-width:760px;margin:0 auto;padding:16px 14px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:0 0 14px}
h2{font-size:21px;margin:0 0 8px;color:var(--navy)}
h3{font-size:17px;margin:14px 0 6px;color:var(--navy)}
p{margin:8px 0}
.muted{color:var(--muted);font-size:14px}
.btn{display:inline-block;border:0;border-radius:10px;padding:12px 18px;font-size:16px;font-weight:600;
  background:var(--teal);color:#fff;cursor:pointer;margin:6px 6px 0 0}
.btn.secondary{background:#e4e9ef;color:var(--ink)}
.btn.ghost{background:transparent;color:var(--teal);padding:8px 6px}
.btn:disabled{opacity:.45;cursor:default}
.btn.block{display:block;width:100%;margin:10px 0 0}
.progress{height:6px;background:#e3e7ec;border-radius:4px;overflow:hidden;margin:0 0 14px}
.progress>div{height:100%;background:var(--teal);transition:width .3s}
.steplabel{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--teal);font-weight:700;margin-bottom:4px}
.key{background:var(--hi);padding:0 3px;border-radius:3px;font-weight:600}
.term{border-left:4px solid var(--teal);padding:6px 10px;margin:10px 0;background:#f4f8fa;border-radius:0 8px 8px 0}
.term b{color:var(--navy)}
.ex,.nonex{border-radius:10px;padding:10px 12px;margin:8px 0;font-size:16px}
.ex{background:var(--goodbg);border:1px solid #c8e6c9}
.nonex{background:var(--badbg);border:1px solid #f5c6c2}
.ex b,.nonex b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.ex b{color:var(--good)} .nonex b{color:var(--bad)}
.why{font-size:14px;color:var(--muted);margin-top:3px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:10px;
  padding:12px 14px;margin:8px 0;font-size:16px;cursor:pointer;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--teal)}
.opt.correct{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt .n{display:inline-block;width:22px;color:var(--muted);font-weight:700}
input[type=text],textarea{width:100%;font-size:17px;padding:12px;border:2px solid var(--line);border-radius:10px}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--teal)}
.fb{border-radius:10px;padding:12px 14px;margin-top:12px}
.fb.good{background:var(--goodbg);border:1px solid #c8e6c9}
.fb.bad{background:var(--badbg);border:1px solid #f5c6c2}
.fb h4{margin:0 0 4px}
.chip{display:inline-block;background:var(--chip);color:var(--navy);font-size:12px;padding:2px 8px;border-radius:20px;margin:0 6px 6px 0;font-weight:600}
.step{padding:8px 12px;border-left:3px solid var(--line);margin:8px 0}
.step.shown{border-color:var(--teal)}
.step .sn{font-weight:700;color:var(--teal);margin-right:6px}
.lesson-row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
.lesson-row:last-child{border-bottom:0}
.lesson-row .dot{width:28px;height:28px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.dot.locked{background:#e4e7eb;color:#9aa3ad}
.dot.open{background:#fff;border:2px solid var(--teal);color:var(--teal)}
.dot.done{background:var(--good);color:#fff}
.lesson-row .t{flex:1}
.lesson-row .t small{display:block;color:var(--muted);font-size:13px}
.today{display:flex;gap:12px;align-items:center}
.today .num{font-size:28px;font-weight:800;color:var(--teal);min-width:44px;text-align:center}
.diagram{width:100%;height:auto;margin:6px 0}
.score{font-size:44px;font-weight:800;text-align:center;margin:10px 0;color:var(--navy)}
table.mini{border-collapse:collapse;width:100%;font-size:15px;margin:8px 0}
table.mini th,table.mini td{border:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
table.mini th{background:#f0f3f7;color:var(--navy)}
.banner{position:fixed;left:0;right:0;bottom:0;background:var(--navy);color:#fff;padding:12px;text-align:center;z-index:10}
.banner button{margin-left:10px}
.hint{background:#f4f8fa;border:1px dashed var(--teal);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:15px}
.pair{margin:12px 0}
.pair .pt{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin-bottom:4px}
.pair .pg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pf,.pe{border-radius:10px;padding:10px 12px;font-size:15px}
.pf{background:#e8eef6;border:1px solid #c5d3e6}.pe{background:#fff4c2;border:1px solid #ecd889}
.pf b,.pe b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;color:var(--navy)}
</style>
</head>
<body>
<header><div class="row"><h1 id="homeLink">⚖️ Legal Lab</h1><small id="ver"></small></div></header>
<main id="app"></main>
<script src="lessons.js"></script>
<script src="app.js"></script>
</body>
</html>
